[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-prosody"
version = "0.1.1"
description = "Local video transcription, timestamp alignment, acoustic prosody and audited review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
asr = ["mlx-whisper>=0.4,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'", "huggingface-hub>=0.24", "numpy>=1.26", "imageio-ffmpeg>=0.6"]
prosody = ["numpy>=1.26", "librosa>=0.11,<0.12", "imageio-ffmpeg>=0.6", "janome>=0.5,<0.6", "soundfile>=0.12"]
japanese = ["numpy>=1.26", "fugashi>=1.3,<2", "unidic-lite>=1.0.8,<2", "pyopenjtalk>=0.4,<0.5", "onnxruntime>=1.18,<2", "imageio-ffmpeg>=0.6"]
build = ["build>=1", "twine>=5"]

[project.scripts]
video-prosody = "video_prosody.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_prosody = ["web/*.html", "web/*.js", "web/*.css"]
