name: Nix
on: [push, pull_request]
permissions:
  contents: read
jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix flake check --all-systems --no-build
      - run: nix flake check
      - run: nix build --keep-going
      - run: ./result/bin/video-prosody --help
      - run: nix develop -c python -c "import librosa, pyopenjtalk, onnxruntime; print(pyopenjtalk.g2p('がく'))"
