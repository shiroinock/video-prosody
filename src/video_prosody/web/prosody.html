<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>単語と声の確認</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <section class="unitStrip" aria-labelledby="stripTitle">
      <div class="stripHead">
        <h2 id="stripTitle" class="sectionTitle">
          単語 <span id="count" class="num"></span>
        </h2>
        <div class="stripLegend">
          <span>✓ 確認済み</span><span>下線 読みを要確認</span
          ><span>赤枠 再生中</span>
        </div>
      </div>
      <div id="wordList"></div>
    </section>
    <main class="editorLayout">
      <section class="editor panel" aria-labelledby="wordText">
        <div class="editorHead">
          <div class="titles">
            <h1 id="wordText">単語を選択</h1>
            <p id="context" class="context"></p>
          </div>
          <div class="navBtns">
            <button id="prevItem" title="前の単語（←）">前へ</button>
            <button id="nextItem" title="次の単語（→）">次へ</button>
            <button id="wordPlay" title="選択中の単語を再生（R）">
              単語を再生
            </button>
          </div>
        </div>
        <div id="moraInfo" class="facts"></div>
        <p id="notice" class="notice" hidden></p>
        <svg
          id="chart"
          class="chart"
          viewBox="0 0 800 240"
          aria-label="選択中の単語の前後の声の高さと音量"
        ></svg>
        <div class="chartLegend">
          <span><i style="background: var(--pitch)"></i>声の高さ（Hz）</span>
          <span><i style="background: var(--volume)"></i>音量（dBFS）</span>
          <span><i style="background: var(--band-selected)"></i>選択中の単語</span>
          <span><i style="background: var(--playhead)"></i>再生位置</span>
          <span>クリックでその位置へ移動</span>
        </div>
        <div class="boundaries">
          <div class="boundary start">
            <div class="boundaryHead">
              <span class="sectionTitle">開始</span>
              <input id="start" type="number" step="0.01" min="0" aria-label="開始（秒）" />
              <span class="muted small">秒</span>
            </div>
            <div class="nudges">
              <button data-boundary="start" data-delta="-0.05" aria-label="開始を0.05秒早める">−0.05</button>
              <button data-boundary="start" data-delta="-0.01" aria-label="開始を0.01秒早める">−0.01</button>
              <button id="repeatStart" class="listen" aria-pressed="false">前後を聴く</button>
              <button data-boundary="start" data-delta="0.01" aria-label="開始を0.01秒遅らせる">＋0.01</button>
              <button data-boundary="start" data-delta="0.05" aria-label="開始を0.05秒遅らせる">＋0.05</button>
            </div>
            <div><button id="setStart" class="quiet">再生位置を開始にする</button></div>
          </div>
          <div class="boundary end">
            <div class="boundaryHead">
              <span class="sectionTitle">終了</span>
              <input id="end" type="number" step="0.01" min="0" aria-label="終了（秒）" />
              <span class="muted small">秒</span>
            </div>
            <div class="nudges">
              <button data-boundary="end" data-delta="-0.05" aria-label="終了を0.05秒早める">−0.05</button>
              <button data-boundary="end" data-delta="-0.01" aria-label="終了を0.01秒早める">−0.01</button>
              <button id="repeatEnd" class="listen" aria-pressed="false">前後を聴く</button>
              <button data-boundary="end" data-delta="0.01" aria-label="終了を0.01秒遅らせる">＋0.01</button>
              <button data-boundary="end" data-delta="0.05" aria-label="終了を0.05秒遅らせる">＋0.05</button>
            </div>
            <div><button id="setEnd" class="quiet">再生位置を終了にする</button></div>
          </div>
        </div>
        <div class="boundaryFoot">
          <label
            >聴く範囲
            <select id="boundaryWindow" aria-label="境界の前後に再生する時間">
              <option value="0.2">前後0.2秒</option>
              <option value="0.35" selected>前後0.35秒</option>
              <option value="0.6">前後0.6秒</option>
              <option value="1">前後1秒</option>
            </select></label
          >
          <span id="boundaryStatus" role="status"></span>
        </div>
        <dl id="metrics" class="stats"></dl>
      </section>
      <aside class="form panel" aria-label="単語の訂正">
        <div class="media">
          <video id="audioVideo" controls preload="metadata" playsinline></video>
        </div>
        <label class="field">表記<input id="text" /></label>
        <label class="field"
          >発音（ひらがな）<input id="pronunciation" placeholder="空欄なら辞書の発音" />
          <span class="help">モーラ数はこの発音から数えます。</span></label
        >
        <label class="check"
          ><input id="pronunciationVerified" type="checkbox" /> 発音を確認済み</label
        >
        <details id="overrides">
          <summary>高さ・音量を手動で上書き</summary>
          <div>
            <label class="field"
              >高さ（Hz）<input id="pitch" type="number" step="0.1" min="20" max="2000" placeholder="空欄なら自動"
            /></label>
            <label class="field"
              >音量（dBFS）<input id="volume" type="number" step="0.1" min="-160" max="0" placeholder="空欄なら自動"
            /></label>
            <p class="small muted">自動の計測値は別に残ります。</p>
          </div>
        </details>
        <label class="field">訂正理由<input id="reason" placeholder="任意" /></label>
        <label class="check"
          ><input id="verified" type="checkbox" /> 境界を聴いて確認済み</label
        >
        <div class="formActions">
          <button id="saveWord" title="Ctrl+S">保存</button>
          <button id="confirmWord" class="primary" title="Ctrl+Enter">
            確認済みにして次へ
          </button>
        </div>
        <p id="saveState" class="formStatus" role="status"></p>
        <div class="formFoot">
          <p class="small muted">
            境界と発音は推定です。高さはBGMを含む音声からの推定で、語間は隣の単語との時間差です（無音とは限りません）。時刻を保存すると、長さ・高さ・音量・語間を計算し直します。
          </p>
          <details class="history">
            <summary>単語の訂正履歴（<span id="auditCount">0</span>件）</summary>
            <div id="audit" class="historyList"></div>
          </details>
        </div>
      </aside>
    </main>
    <script src="/common.js"></script>
    <script src="/prosody.js"></script>
  </body>
</html>
