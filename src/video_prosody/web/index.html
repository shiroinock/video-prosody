<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>文字起こしの確認</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="transcriptLayout">
      <aside class="sidePanel">
        <div class="media">
          <video id="player" controls preload="metadata" playsinline></video>
        </div>
        <p id="playbackStatus" class="small muted" role="status"></p>
        <p class="small muted">
          区間の時刻は音声認識の推定です。前後も少し含めて再生します。
        </p>
        <a id="source" class="small" target="_blank" rel="noreferrer"
          >参照元を開く</a
        >
        <details class="history">
          <summary>訂正履歴（<span id="historyCount">0</span>件）</summary>
          <div id="history" class="historyList"></div>
        </details>
      </aside>
      <section aria-labelledby="listTitle">
        <div class="listHeader">
          <h1 id="listTitle" class="sectionTitle">発言の区間</h1>
          <div class="filters" role="group" aria-label="表示する区間">
            <button data-filter="all" aria-pressed="true">
              すべて <span class="num" data-count="all"></span>
            </button>
            <button data-filter="pending" aria-pressed="false">
              未確認 <span class="num" data-count="pending"></span>
            </button>
            <button data-filter="review" aria-pressed="false">
              要確認 <span class="num" data-count="review"></span>
            </button>
          </div>
        </div>
        <div id="segments"></div>
      </section>
    </main>
    <script src="/common.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
